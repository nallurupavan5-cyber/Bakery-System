services:
  - type: web
    name: sweet-delights-bms
    env: python
    plan: free
    region: oregon
    runtime: python-3.11.9
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    releaseCommand: "python -c \"from app import create_app; from database.seed import seed_database; seed_database(create_app())\""
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: bakery-db
          property: connectionString
      - key: FLASK_DEBUG
        value: "false"
      - key: PYTHON_VERSION
        value: "3.11.9"

databases:
  - name: bakery-db
    plan: free
    region: oregon
