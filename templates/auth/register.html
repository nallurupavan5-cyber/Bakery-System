{% extends 'base.html' %}
{% block title %}Create Account | {{ bakery_name }}{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-6 col-md-8">
      
      <div class="card border-0 shadow-md rounded-4 p-4 p-md-5 bg-white">
        <div class="text-center mb-4">
          <div class="d-inline-flex align-items-center justify-content-center bg-warning-subtle text-warning rounded-circle p-3 mb-3" style="width: 64px; height: 64px;">
            <i class="bi bi-person-plus fs-2" style="color: var(--bakery-caramel) !important;"></i>
          </div>
          <h2 class="h3 fw-bold">Join Our Bakery Family</h2>
          <p class="text-muted small">Create an account to order fresh breads, cakes, and track deliveries</p>
        </div>

        <form method="POST" action="{{ url_for('auth.register') }}">
          <div class="row g-3">
            <div class="col-12">
              <label class="form-label fw-semibold small">Full Name <span class="text-danger">*</span></label>
              <input type="text" name="name" class="form-control bg-light" placeholder="e.g. Jane Doe" required>
            </div>

            <div class="col-md-6">
              <label class="form-label fw-semibold small">Username <span class="text-danger">*</span></label>
              <input type="text" name="username" class="form-control bg-light" placeholder="e.g. janedoe" required>
            </div>

            <div class="col-md-6">
              <label class="form-label fw-semibold small">Phone Number <span class="text-danger">*</span></label>
              <input type="tel" name="phone" class="form-control bg-light" placeholder="+1 (555) 000-0000" required>
            </div>

            <div class="col-12">
              <label class="form-label fw-semibold small">Email Address</label>
              <input type="email" name="email" class="form-control bg-light" placeholder="jane@example.com">
            </div>

            <div class="col-md-6">
              <label class="form-label fw-semibold small">Password <span class="text-danger">*</span></label>
              <input type="password" name="password" class="form-control bg-light" placeholder="At least 6 characters" minlength="6" required>
            </div>

            <div class="col-md-6">
              <label class="form-label fw-semibold small">Confirm Password <span class="text-danger">*</span></label>
              <input type="password" name="confirm_password" class="form-control bg-light" placeholder="Re-enter password" minlength="6" required>
            </div>

            <div class="col-12">
              <label class="form-label fw-semibold small">Delivery / Street Address</label>
              <textarea name="address" class="form-control bg-light" rows="2" placeholder="Your street address, apartment, city"></textarea>
            </div>
          </div>

          <button type="submit" class="btn btn-caramel w-100 py-2 mt-4 mb-3">
            <i class="bi bi-check2-circle me-1"></i> Complete Registration
          </button>

          <div class="text-center small text-muted">
            Already registered? <a href="{{ url_for('auth.login') }}" class="fw-bold text-decoration-none" style="color: var(--bakery-caramel);">Sign In Here</a>
          </div>
        </form>

      </div>

    </div>
  </div>
</div>
{% endblock %}
