{% extends 'base.html' %}
{% block title %}Account Profile | {{ bakery_name }}{% endblock %}

{% block content %}
<div class="container py-4">

  <div class="row justify-content-center">
    <div class="col-lg-7">
      
      <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-white">
        <div class="d-flex align-items-center gap-3 mb-4 border-bottom pb-3">
          <div class="d-inline-flex p-3 rounded-circle" style="background: var(--bakery-caramel-light);">
            <i class="bi bi-person-gear fs-2" style="color: var(--bakery-caramel);"></i>
          </div>
          <div>
            <h2 class="h4 fw-bold mb-0">{{ current_user.username }}</h2>
            <span class="badge bg-secondary-subtle text-secondary small">Role: {{ current_user.role }}</span>
          </div>
        </div>

        <form method="POST" action="{{ url_for('auth.profile') }}">
          <div class="row g-3">
            <div class="col-12">
              <label class="form-label small fw-semibold">Full Name <span class="text-danger">*</span></label>
              <input type="text" name="name" class="form-control bg-light" 
                     value="{{ customer.name if customer else (staff.name if staff else current_user.username) }}" required>
            </div>

            <div class="col-md-6">
              <label class="form-label small fw-semibold">Phone Number <span class="text-danger">*</span></label>
              <input type="tel" name="phone" class="form-control bg-light" 
                     value="{{ customer.phone if customer else (staff.phone if staff else '') }}" required>
            </div>

            <div class="col-md-6">
              <label class="form-label small fw-semibold">Email Address</label>
              <input type="email" name="email" class="form-control bg-light" 
                     value="{{ customer.email if customer and customer.email else '' }}">
            </div>

            {% if customer %}
              <div class="col-12">
                <label class="form-label small fw-semibold">Delivery Address</label>
                <textarea name="address" class="form-control bg-light" rows="2">{{ customer.address if customer and customer.address else '' }}</textarea>
              </div>
            {% endif %}

            <div class="col-12 pt-3 border-top">
              <h5 class="fw-bold mb-2">Change Password</h5>
              <p class="text-muted small mb-3">Leave blank if you don't wish to change your current password.</p>
              <input type="password" name="new_password" class="form-control bg-light" placeholder="New password (min 6 characters)" minlength="6">
            </div>
          </div>

          <div class="mt-4 pt-2 text-end">
            <button type="submit" class="btn btn-caramel px-4 py-2">
              <i class="bi bi-save me-1"></i> Save Changes
            </button>
          </div>
        </form>
      </div>

    </div>
  </div>

</div>
{% endblock %}
