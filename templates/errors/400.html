{% extends 'base.html' %}
{% block title %}400 Bad Request{% endblock %}
{% block content %}
<div class="container py-5 my-5 text-center">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card p-5 border-0 shadow-sm rounded-4">
        <div class="display-1 fw-bold text-warning mb-3">
          <i class="bi bi-question-diamond"></i> 400
        </div>
        <h2 class="mb-3">Bad Order Request</h2>
        <p class="text-muted mb-4">
          The request was invalid or could not be processed. Please verify your inputs and try again.
        </p>
        <a href="{{ url_for('customer.home') }}" class="btn btn-bakery">Return Home</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
