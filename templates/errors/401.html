{% extends 'base.html' %}
{% block title %}401 Unauthorized{% endblock %}
{% block content %}
<div class="container py-5 my-5 text-center">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card p-5 border-0 shadow-sm rounded-4">
        <div class="display-1 fw-bold text-warning mb-3">
          <i class="bi bi-key"></i> 401
        </div>
        <h2 class="mb-3">Authentication Required</h2>
        <p class="text-muted mb-4">
          Please log in to your bakery account to access this page.
        </p>
        <a href="{{ url_for('auth.login') }}" class="btn btn-caramel">Sign In Now</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
