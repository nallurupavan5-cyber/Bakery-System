{% extends 'base.html' %}
{% block title %}403 Forbidden Access{% endblock %}
{% block content %}
<div class="container py-5 my-5 text-center">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card p-5 border-0 shadow-sm rounded-4">
        <div class="display-1 fw-bold text-danger mb-3">
          <i class="bi bi-shield-x"></i> 403
        </div>
        <h2 class="mb-3">Kitchen Door Locked</h2>
        <p class="text-muted mb-4">
          You do not have permission to enter this staff section. Role-based access control (RBAC) has prevented unauthorized access.
        </p>
        <div class="d-flex justify-content-center gap-3">
          <a href="{{ url_for('customer.home') }}" class="btn btn-bakery">
            <i class="bi bi-house me-1"></i> Return Home
          </a>
          <a href="{{ url_for('auth.login') }}" class="btn btn-outline-bakery">
            <i class="bi bi-box-arrow-in-right me-1"></i> Switch Account
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
