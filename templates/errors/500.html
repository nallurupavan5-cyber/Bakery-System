{% extends 'base.html' %}
{% block title %}500 Server Error{% endblock %}
{% block content %}
<div class="container py-5 my-5 text-center">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card p-5 border-0 shadow-sm rounded-4">
        <div class="display-1 fw-bold text-danger mb-3">
          <i class="bi bi-exclamation-triangle"></i> 500
        </div>
        <h2 class="mb-3">Kitchen Malfunction</h2>
        <p class="text-muted mb-4">
          Something went wrong on our server. The transaction has been rolled back safely. Please try again or return home.
        </p>
        <div>
          <a href="{{ url_for('customer.home') }}" class="btn btn-bakery">
            <i class="bi bi-house me-1"></i> Return to Safety
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
