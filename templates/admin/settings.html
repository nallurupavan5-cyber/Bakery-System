{% extends 'base.html' %}
{% block title %}System Settings | {{ bakery_name }}{% endblock %}

{% block content %}
<div class="container py-4">

  <div class="row justify-content-center">
    <div class="col-lg-8">
      
      <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-white">
        <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
          <h2 class="h4 fw-bold mb-0">
            <i class="bi bi-sliders text-warning me-2"></i> Bakery System Settings
          </h2>
          <a href="{{ url_for('admin.dashboard') }}" class="btn btn-outline-secondary btn-sm">Dashboard</a>
        </div>

        <form method="POST">
          <div class="row g-3">
            
            <div class="col-md-6">
              <label class="form-label small fw-semibold">Bakery Official Name</label>
              <input type="text" name="bakery_name" class="form-control" value="{{ settings.get('bakery_name', 'Sweet Delights Artisan Bakery') }}" required>
            </div>

            <div class="col-md-6">
              <label class="form-label small fw-semibold">Tagline / Motto</label>
              <input type="text" name="bakery_tagline" class="form-control" value="{{ settings.get('bakery_tagline', 'Freshly Baked, Made With Love') }}">
            </div>

            <div class="col-md-6">
              <label class="form-label small fw-semibold">Customer Support Phone</label>
              <input type="tel" name="bakery_phone" class="form-control" value="{{ settings.get('bakery_phone', '+1 (555) 234-5678') }}" required>
            </div>

            <div class="col-md-6">
              <label class="form-label small fw-semibold">Official Email</label>
              <input type="email" name="bakery_email" class="form-control" value="{{ settings.get('bakery_email', 'contact@sweetdelightsbakery.com') }}" required>
            </div>

            <div class="col-12">
              <label class="form-label small fw-semibold">Physical Bakery Address</label>
              <textarea name="bakery_address" class="form-control" rows="2" required>{{ settings.get('bakery_address', '124 Sugarloaf Lane, Flour District') }}</textarea>
            </div>

            <div class="col-md-4">
              <label class="form-label small fw-semibold">Currency Display Symbol</label>
              <input type="text" name="currency_symbol" class="form-control text-center" value="{{ settings.get('currency_symbol', '$') }}" required>
            </div>

            <div class="col-md-4">
              <label class="form-label small fw-semibold">Default Sales Tax (%)</label>
              <input type="number" step="0.1" min="0" max="50" name="default_tax_percent" class="form-control text-center" value="{{ settings.get('default_tax_percent', '5.0') }}" required>
            </div>

            <div class="col-md-4">
              <label class="form-label small fw-semibold">Default Discount (%)</label>
              <input type="number" step="0.1" min="0" max="100" name="default_discount_percent" class="form-control text-center" value="{{ settings.get('default_discount_percent', '0.0') }}" required>
            </div>

          </div>

          <div class="mt-4 pt-3 border-top text-end">
            <button type="submit" class="btn btn-caramel px-4 py-2">
              <i class="bi bi-save me-1"></i> Save Configuration
            </button>
          </div>
        </form>

      </div>

    </div>
  </div>

</div>
{% endblock %}
